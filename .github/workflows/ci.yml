name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  sea:
    needs: verify
    uses: ./.github/workflows/sea.yml
