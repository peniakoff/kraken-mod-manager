name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Check the tag matches every package version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/check-version.mjs "$TAG"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  sea:
    needs: verify
    uses: ./.github/workflows/sea.yml

  # A draft keeps a person in the loop: nothing is public until someone
  # reviews the assets and notes and presses Publish.
  draft-release:
    needs: sea
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: kraken-mod-manager-*
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum kraken-mod-manager-* | tee SHA256SUMS
      - name: Extract release notes from the changelog
        run: node scripts/release/notes.mjs "$TAG" > release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" release/*
          --draft --verify-tag
          --title "Kraken Mod Manager $TAG"
          --notes-file release-notes.md
